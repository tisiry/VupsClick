plugins {
    id 'fabric-loom' version '1.6-SNAPSHOT'
}

version = "1.21-1.0.0"
group = "tisiry"

repositories {
    // Исправленный адрес репозитория (добавлен /maven/)
    maven { url = "https://fabricmc.net" }
    mavenCentral()
}

dependencies {
    // Версия игры 1.21
    minecraft "com.mojang:minecraft:1.21"

    // Актуальные маппинги Yarn для 1.21
    mappings "net.fabricmc:yarn:1.21+build.9:v2"

    // Загрузчик (Loader)
    modImplementation "net.fabricmc:fabric-loader:0.15.11"

    // Fabric API для 1.21
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.102.0+1.21"
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

// Добавляем поддержку Java 21 в сам проект
java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

