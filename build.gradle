plugins {
    id 'fabric-loom' version '1.6-SNAPSHOT'
}

version = "1.20.4" // Это версия твоего мода
group = "tisiry"

dependencies {
    minecraft "com.mojang:minecraft:1.20.4"

    // Обновленные маппинги для 1.20.4
    mappings "net.fabricmc:yarn:1.20.4+build.3:v2"

    // Загрузчик можно оставить этот или чуть новее
    modImplementation "net.fabricmc:fabric-loader:0.15.11"

    // Актуальная версия Fabric API для 1.20.4
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.97.0+1.20.4"
}
